<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f5" />
    <meta
      name="description"
      content="Learn React with 24 illustrated lessons. Follow a state update, trace an effect, or reorder a list to see how React uses keys."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>React, Rendered · An interactive field guide</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('rendered-theme') ||
          (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
